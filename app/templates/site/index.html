<!DOCTYPE html>
{% load static %}
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Solicite agora seu orçamento para planos de saúde Unimed São Carlos. Oferecemos preços acessíveis, condições especiais e cobertura completa. Garanta saúde e bem-estar para você e sua família!">
    <title>AF Saúde e Benefícios - Unimed</title>

    <!-- Favicon -->
    <link rel="icon" href="https://www.afunimedsaocarlos.com.br/static/img/logo.webp" type="image/png">

    <!-- Normalize.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.2.1.js" integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE=" crossorigin="anonymous"></script>

    <!-- Bootstrap 4 CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Font Awesome 5 CDN -->
    <script src="https://kit.fontawesome.com/a69cec9c91.js" crossorigin="anonymous"></script>

    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/estilo-index.css' %}">

    <!-- JS -->
    <script type="text/javascript" src="{% static 'js/script-index.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/script-modal.js' %}"></script>
</head>

<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="spinner "><img src="{% static 'img/logo.webp' %}" width="70px" height="70px"></div>
    </div>
    <!-- Header -->
    <header class="m-0 pt-5">
        <div id="div-logo" class="col-12 text-center">
            <img src="{% static 'img/logo.webp' %}" class="img img-fluid" loading="lazy" id="img-logo" alt="LOGO MARCA">
            <span class="col-8 text-center" id="logo-plano">
                <img src="{% static 'img/logo-unimed-nacional.png' %}" loading="lazy" class="img img-fluid" id="img-logo-plano" alt="LOGO MARCA DO PLANO DE SAÚDE">
            </span>
        </div>
    </header>

    <!-- Container -->
    <div class="container-fluid p-2 mt-2" id="container">
        <div id="conteudo" class="font-weight-bold">
            <!-- Copy da LP -->
            <div id="copy-lp" class="text-center p-2">
                <div id="text-copy-lp" class="text-white p-3 col-lg-5">
                    <h1 id="header-contrate-plano" class="mt-2">Seja Cliente Unimed.</h1>

                    <!-- Imagem destaque para mobile -->
                    <img src="{% static 'img/avatar-medica.png' %}" loading="lazy" id="destaque-mobile" class="m-0 p-0 border border-dark" alt="hospital-unimed-mobile">

                    <!-- Formulário de Leads -->
                    <div id="div-form" class="bg-white rounded text-dark border border-dark m-0 p-2">
                        <div class="p-2">
                            <h3 class="p-1">Obtenha sua cotação!!</h3>
                            <h5>Preencha formulário</h5>
                        </div>

                        <form class="form p-2" id="form" method="POST">
                            {% csrf_token %}

                            <div id="campos-form" class="p-3">
                                <!-- Campo Nome -->
                                <div class="p-0 m-0">
                                    <label for="nome">NOME</label>
                                    <small class="text-center text-dark">*Obrigatório</small>
                                    <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu Nome">
                                    <br>
                                </div>

                                <!-- Campo WhatsApp -->
                                <div class="p-0 m-0">
                                    <label for="whatsapp">WHATSAPP</label>
                                    <small class="text-center text-dark">*Obrigatório</small>
                                    <input type="tel" id="whatsapp" name="whatsapp" class="form-control" placeholder="Digite seu WhatsApp" maxlength="15" required>
                                    <br>
                                </div>

                                <!-- Checkbox Aceitação de Termos -->
                                <div class="p-0 m-0">
                                    <label for="aceito-termos">
                                        <input type="checkbox" id="aceito-termos" name="aceito_termos" disabled>
                                        <small class="text-center text-dark">*Obrigatório</small>
                                        <small class="text-center text-dark text-justify">Declaro que li e aceito a Política de Privacidade...</small>
                                    </label>
                                    <br>
                                </div>

                                <!-- Botão de Envio -->
                                <div class="p-3">
                                    <input type="submit" id="btn-enviar" name="btn-enviar" disabled value="Obter Cotação" class="btn btn-lg btn-warning blink-btn">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!-- BANNER UNIMED-->
            <div class="row" id="banner">
                <img class="img img-fluid " width="1217px" height="596px" id="img-banner" src="{% static 'img/logo-unimed-nacional.png' %}" alt="Banner Unimed">
            </div>

            <!-- BTN WHATSAPP ESTATICO -->
            <div id="central-vendas" class="row m-3 p-0">
                <a id="btn-central-vendas" class="btn btn-light btn-lg p-3 col-12 ">
                    <i class="fab fa-whatsapp font-size-central-vendas"></i>
                    <span class="font-size-central-vendas">CENTRAL DE VENDAS</span>
                    <div class="font-size-central-vendas">16 99962-8815</div>
                </a>
            </div>
            <script type="text/javascript">
                $(document).ready(function() {
                    $("#btn-central-vendas").click(function() {
                        // Abre o WhatsApp em uma nova aba
                        window.open("https://wa.me/5516993379492?text=Olá%20gostaria%20de%20atendimento%20pela%20central%20de%20vendas%20AF%20saúde%20-Norden!", "_blank");
                    });
                });
            </script>

            <!-- BTN WHATSAPP FLUTUANTE -->
            <div id="btn-flutuante" >
               <i class="fab fa-whatsapp fa-flip-horizontal btn-whatsapp-flutuante  "></i>
               <div class="bg-white rounded text-dark p-2 blink text-nowrap box-shadow text-auxiliar-btn-whatsapp">Faça sua cotação!!</div>
            </div>
           <script type="text/javascript">
                $(document).ready(function() {
                    $("#btn-flutuante").click(function() {
                        // Abre o WhatsApp em uma nova aba
                        window.open("https://wa.me/55{{config_wa}}?text=Olá%20gostaria%20de%20mais%20informações%20sobre%20os%20planos%20de%20saúde%20norden!", "_blank");
                    });
                });
            </script>



            
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-white mb-5 p-0">
        <i class="fa fa-copyright" aria-hidden="true">Copyright</i>
        <div>Antherus - Desenvolvimento Web</div>
        <small><i class="fa fa-whatsapp mr-1" aria-hidden="true"></i><span>(16) 99337-9492</span></small>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
